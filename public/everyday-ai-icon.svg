<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (transparent) -->
  <rect width="240" height="240" fill="transparent"/>
  
  <!-- Icon Group (Centered) -->
  <g transform="translate(60, 120)">
    <!-- Main geometric pattern - Golden ratio spiral inspired -->
    <path d="M0,0 L40,-40 L80,0 L40,40 Z" fill="#D9A347" />
    <path d="M20,-20 L60,-60 L100,-20 L60,20 Z" fill="#C78A32" />
    <path d="M40,0 L80,-40 L120,0 L80,40 Z" fill="#E4B76A" />
    
    <!-- Central connecting element -->
    <circle cx="60" cy="0" r="15" fill="#C78A32" stroke="#E4B76A" stroke-width="2" />
    
    <!-- Fine details for sophistication -->
    <path d="M60,0 L90,-30 M60,0 L30,-30 M60,0 L90,30 M60,0 L30,30" stroke="#F0D7A8" stroke-width="1.5" />
  </g>
</svg>